name: Check Hermes Updates

on:
  schedule:
    # Uruchamia sprawdzanie codziennie o godzinie 03:00 w nocy
    - cron: '0 3 * * *'
  workflow_dispatch: # Pozwala też na ręczne kliknięcie "Run workflow" w dowolnym momencie

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest release tag from GitHub/DockerHub
        id: get_version
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/nousresearch/hermes-agent/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "latest_version=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Update config.yaml files
        run: |
          NEW_VER="${{ steps.get_version.outputs.latest_version }}"
          if [ -n "$NEW_VER" ] && [ "$NEW_VER" != "null" ]; then
            sed -i "s/version: \".*\"/version: \"$NEW_VER\"/g" hermes-agent/config.yaml
            sed -i "s/version: \".*\"/version: \"$NEW_VER\"/g" hermes-home/config.yaml
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hermes-agent/config.yaml hermes-agent-2/config.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update version to ${{ steps.get_version.outputs.latest_version }}" && git push)
